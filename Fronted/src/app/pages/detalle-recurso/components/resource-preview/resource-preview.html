@if (detail.showPreview()) {
  <div class="mb-2">
    <div class="rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
      <div class="flex items-center justify-between gap-3 border-b border-slate-100 bg-slate-50 px-4 py-2.5">
        <div class="flex items-center gap-2 text-xs font-semibold text-slate-500">
          <svg class="h-3.5 w-3.5 text-main-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
          </svg>
          Vista previa - {{ detail.resource().format }} &middot; {{ detail.resourceMetricLabel() }}
        </div>
        <span class="text-[10px] font-medium text-slate-400">{{ detail.previewProviderLabel() }}</span>
      </div>

      @if (!detail.previewLoaded()) {
        <div class="flex flex-col items-center justify-center gap-3 py-16 bg-white">
          <svg class="h-8 w-8 animate-spin text-main-400" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          <p class="text-sm text-slate-400 font-medium">Cargando vista previa...</p>
        </div>
      }

      <iframe
        [src]="detail.previewUrl()"
        (load)="detail.onPreviewLoad()"
        class="w-full transition-opacity duration-300"
        [class.opacity-0]="!detail.previewLoaded()"
        [class.h-0]="!detail.previewLoaded()"
        [class.h-[600px]]="detail.previewLoaded()"
        style="border: none;"
        title="Vista previa del recurso"
        allow="fullscreen"
      ></iframe>
    </div>

    <hr class="border-slate-100 mt-8 mb-2" />
  </div>
}
