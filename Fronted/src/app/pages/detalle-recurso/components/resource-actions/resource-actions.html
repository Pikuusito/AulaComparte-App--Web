<!-- Acciones -->
<div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 pt-4 pb-4 mt-2">
  <!-- Botón descargar -->
  <a
    [href]="detail.downloadUrl()"
    target="_blank"
    rel="noopener"
    (click)="detail.downloadResource($event)"
    [attr.aria-disabled]="detail.isDownloading() || !detail.downloadUrl()"
    class="flex flex-1 items-center justify-center gap-2 rounded-xl px-5 py-2.5 font-bold text-sm transition disabled:cursor-not-allowed"
    [ngClass]="detail.downloaded()
      ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
      : 'bg-main-600 text-white shadow-[0_4px_12px_rgba(13,148,136,0.2)] hover:bg-main-700 hover:shadow-[0_6px_16px_rgba(13,148,136,0.3)] hover:-translate-y-0.5'"
    [class.pointer-events-none]="detail.isDownloading() || !detail.downloadUrl()"
    [class.opacity-70]="detail.isDownloading() || !detail.downloadUrl()"
  >
    @if (detail.isDownloading()) {
      <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
      Descargando...
    } @else if (detail.downloaded()) {
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
      Descargado
    } @else {
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12M12 16.5V3"/>
      </svg>
      Descargar recurso
    }
  </a>

  <!-- Botón Vista previa -->
  <button
    (click)="detail.togglePreview()"
    class="flex items-center justify-center gap-2 rounded-xl border border-slate-200 px-5 py-2.5 font-bold text-sm transition hover:-translate-y-0.5"
    [ngClass]="detail.showPreview()
      ? 'border-main-300 bg-main-50 text-main-700'
      : 'bg-white text-slate-700 hover:border-main-200 hover:text-main-700 hover:shadow-md'"
  >
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
    </svg>
    {{ detail.showPreview() ? 'Cerrar vista previa' : 'Vista previa' }}
  </button>

  <!-- Contador de descargas -->
  <div
    class="inline-flex shrink-0 items-center justify-center gap-1.5 rounded-full bg-slate-50 px-3 py-2 text-sm font-black text-slate-600 ring-1 ring-slate-100"
    title="Descargas"
    aria-label="Descargas"
  >
    <span>{{ detail.resource().downloads ?? 0 }}</span>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4 text-main-600"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2.4"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"
      />
    </svg>
  </div>
</div>
