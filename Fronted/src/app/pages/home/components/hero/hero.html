<section class="relative pt-24 pb-10 lg:pt-32 lg:pb-16 overflow-hidden bg-slate-50">
  
  <!-- CAPA 0 (Más profunda): La Imagen de Fondo fusionada -->
  <div class="absolute inset-y-0 right-0 w-[90%] sm:w-[80%] md:w-[70%] lg:w-[50%] xl:w-[45%] h-full z-0 pointer-events-none">
    <img src="img/imagen_hero.png" 
         alt="Fondo AulaComparte" 
         class="w-full h-full object-cover object-top lg:object-[right_top] transform origin-top-right scale-105 hover:scale-110 transition duration-1000 opacity-90"
         style="-webkit-mask-image: linear-gradient(to left, black 50%, transparent 95%); mask-image: linear-gradient(to left, black 50%, transparent 95%);" />
  </div>

  <!-- CAPA 1: Luces y Gradientes de color para que no se vea plano -->
  <div class="absolute inset-y-0 w-full h-full z-0 pointer-events-none">
    <div class="absolute top-0 right-0 w-[800px] h-[800px] bg-main-600/10 rounded-full blur-[100px] mix-blend-multiply"></div>
    <div class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-cyan-600/5 rounded-full blur-[100px] mix-blend-multiply"></div>
  </div>

  <!-- CAPA 2 (Frente): Contenido, Textos y Botones -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    
    <!-- Contenedor del texto -->
    <div class="text-left max-w-2xl relative">

      <!-- Título Principal -->
      <h1 class="text-5xl md:text-6xl lg:text-7xl font-extrabold text-gray-900 tracking-tight leading-tight mb-6 drop-shadow-sm">
        Comparte <br/>
        <span class="whitespace-nowrap text-transparent bg-clip-text bg-gradient-to-r from-main-700 to-main-500">recursos educativos</span>
      </h1>
      
      <!-- Subtítulo -->
      <p class="text-lg md:text-xl text-gray-700 mb-6 max-w-2xl leading-relaxed font-medium">
        Ayudamos a estudiantes a acceder a materiales de estudio y aprender juntos
      </p>

      <!-- Botones de Acción -->
      <div class="flex flex-col sm:flex-row items-start justify-start gap-3 mb-2">

        <!-- Botón primario: Explorar Recursos -->
        <button routerLink="/registro" class="w-full sm:w-auto px-7 py-3.5 bg-main-600 text-white rounded-full font-semibold text-base shadow-lg shadow-main-600/25 hover:bg-main-700 hover:shadow-main-600/40 hover:-translate-y-0.5 active:translate-y-0 active:shadow-md transition-all duration-200 flex items-center justify-center gap-2.5 group">
          <!-- Ícono brújula: más semántico para "explorar" -->
          <svg class="w-[1.1rem] h-[1.1rem] transition-transform duration-300 group-hover:rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" stroke="none"/>
          </svg>
          Explorar recursos
          <!-- Flecha sutil que desliza al hacer hover -->
          <svg class="w-4 h-4 opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
          </svg>
        </button>

        <!-- Botón secundario: Publicar material -->
        <button routerLink="/registro" class="w-full sm:w-auto px-7 py-3.5 bg-white text-gray-700 border border-gray-200 rounded-full font-semibold text-base hover:border-main-300 hover:text-main-700 hover:bg-main-50 hover:-translate-y-0.5 active:translate-y-0 shadow-sm transition-all duration-200 flex items-center justify-center gap-2.5 group">
          <!-- Ícono upload: más semántico para "publicar" -->
          <svg class="w-[1.1rem] h-[1.1rem] text-main-500 transition-transform duration-200 group-hover:-translate-y-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/>
          </svg>
          Publicar material
        </button>

      </div>

    </div>
  </div>
</section>
