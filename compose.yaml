services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 1.0
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    command:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID(N'${DB_NAME}') IS NULL CREATE DATABASE [${DB_NAME}]"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 1433
      STORAGE_DIRECTORY: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - resource_files:/app/storage
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sqlserver_data:
  resource_files:
