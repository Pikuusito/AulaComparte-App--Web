<div class="border-b border-slate-100 px-6 py-6 sm:px-8">
  <div class="flex items-start justify-between gap-4">
    <div class="flex-1 min-w-0">
      <!-- Badge de tipo -->
      <span
        [ngClass]="detail.typeBadgeClasses()"
        class="inline-block rounded-full border px-3 py-0.5 text-xs font-semibold mb-3"
      >
        {{ detail.resource().type }}
      </span>
      <!-- Título -->
      <h1 class="text-2xl font-extrabold text-slate-900 leading-snug sm:text-3xl">
        {{ detail.resource().title }}
      </h1>
      <!-- Meta: autor y fecha -->
      <p class="mt-2 text-sm text-slate-500">
        Por <span class="font-semibold text-slate-700">{{ detail.resource().author }}</span>
        &middot; {{ detail.resource().publishedAgo }}
      </p>
    </div>

    <!-- Botón guardar -->
    <button
      (click)="detail.toggleSave()"
      [title]="detail.resource().isSaved ? 'Quitar de guardados' : 'Guardar recurso'"
      class="flex-shrink-0 rounded-full border border-slate-200 p-2.5 transition hover:border-main-300 hover:bg-main-50"
      [ngClass]="detail.resource().isSaved ? 'border-main-400 bg-main-50 text-main-600' : 'text-slate-400'"
    >
      <svg class="h-5 w-5 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
        [attr.fill]="detail.resource().isSaved ? 'currentColor' : 'none'">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
      </svg>
    </button>
  </div>
</div>
